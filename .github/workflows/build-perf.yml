name: Build XanMod Linux Tools

on:
  workflow_dispatch:
  push:
    branches:
      - feat/apt-and-tools
    tags:
      - "v*"

permissions:
  contents: write

env:
  XANMOD_VERSION: "7.1.6"
  XANMOD_TAG: "7.1.6-xanmod1"
  XANMOD_KERNEL: "7.1.6-x64v3-xanmod1"
  PACKAGE_VERSION: "7.1.6-1"
  APT_CODENAME: noble
  APT_COMPONENT: main

jobs:
  build-tools:
    runs-on: ubuntu-24.04

    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git build-essential flex bison pkg-config \
            autoconf automake libtool \
            libelf-dev libdw-dev libunwind-dev libslang2-dev \
            libperl-dev libpython3-dev libcap-dev libnuma-dev \
            libbabeltrace-dev libtraceevent-dev libtracefs-dev libpfm4-dev \
            libssl-dev libzstd-dev liblzma-dev libaudit-dev libdebuginfod-dev \
            systemtap-sdt-dev llvm libcapstone-dev libpci-dev libpopt-dev \
            libudev-dev libbpf-dev uuid-dev clang python3-docutils default-jdk \
            reprepro gnupg patchelf dpkg-dev file

      - name: Clone XanMod source
        run: |
          git clone --depth 1 --branch "${XANMOD_TAG}" \
            https://gitlab.com/xanmod/linux.git xanmod-linux

      - name: Build kernel userspace tools
        working-directory: xanmod-linux
        run: |
          set -euxo pipefail
          make -C tools/perf -j"$(nproc)"
          make -C tools/bpf/bpftool -j"$(nproc)"
          make -C tools/power/cpupower -j"$(nproc)"
          make -C tools/power/x86/turbostat -j"$(nproc)"
          make -C tools/power/x86/x86_energy_perf_policy -j"$(nproc)"
          make -C tools/tracing/rtla -j"$(nproc)"

          cd tools/usb/usbip
          ./autogen.sh
          ./configure --with-tcp-wrappers=no
          make -j"$(nproc)"

          cd ../../..
          make -C tools acpi -j"$(nproc)"

      - name: Verify built tools
        working-directory: xanmod-linux
        run: |
          set -eux
          ./tools/perf/perf version
          if [ -x ./tools/bpf/bpftool/src/bpftool ]; then
            ./tools/bpf/bpftool/src/bpftool version
          else
            ./tools/bpf/bpftool/bpftool version
          fi

          CPUP_POWER_DIR="$(pwd)/tools/power/cpupower"
          LD_LIBRARY_PATH="${CPUP_POWER_DIR}:${LD_LIBRARY_PATH:-}" \
            ./tools/power/cpupower/cpupower --version
          ./tools/power/x86/turbostat/turbostat --version
          ./tools/power/x86/x86_energy_perf_policy/x86_energy_perf_policy --help \
            >/dev/null 2>&1 || test $? -eq 1
          ./tools/tracing/rtla/rtla --help >/dev/null

          USBIP_BIN="$(find ./tools/usb/usbip -path '*/.libs/usbip' -type f -perm -111 -print -quit)"
          USBIPD_BIN="$(find ./tools/usb/usbip -path '*/.libs/usbipd' -type f -perm -111 -print -quit)"
          USBIP_LIB="$(find ./tools/usb/usbip -type f -name 'libusbip.so.*' -print -quit)"
          test -n "${USBIP_BIN}"
          test -n "${USBIPD_BIN}"
          test -n "${USBIP_LIB}"
          USBIP_LIB_DIR="$(dirname "${USBIP_LIB}")"
          LD_LIBRARY_PATH="${USBIP_LIB_DIR}:${LD_LIBRARY_PATH:-}" "${USBIP_BIN}" version
          LD_LIBRARY_PATH="${USBIP_LIB_DIR}:${LD_LIBRARY_PATH:-}" "${USBIPD_BIN}" --version || true

          for tool in acpidbg acpidump ec pfrut; do
            ACPI_BIN="$(find ./tools/power/acpi -type f -name "${tool}" -perm -111 -print -quit)"
            test -n "${ACPI_BIN}"
            test -x "${ACPI_BIN}"
            echo "Found ${tool}: ${ACPI_BIN}"
          done

      - name: Prepare tools tree
        working-directory: xanmod-linux
        run: |
          set -euxo pipefail
          VERSION_ROOT="../output/tools/${XANMOD_KERNEL}"
          mkdir -p "${VERSION_ROOT}" ../output/bin

          cp tools/perf/perf "${VERSION_ROOT}/perf"
          if [ -f tools/perf/libperf-jvmti.so ]; then
            cp tools/perf/libperf-jvmti.so "${VERSION_ROOT}/libperf-jvmti.so"
          fi
          if [ -f tools/bpf/bpftool/src/bpftool ]; then
            cp tools/bpf/bpftool/src/bpftool "${VERSION_ROOT}/bpftool"
          else
            cp tools/bpf/bpftool/bpftool "${VERSION_ROOT}/bpftool"
          fi

          cp tools/power/cpupower/cpupower "${VERSION_ROOT}/cpupower"
          find tools/power/cpupower -maxdepth 3 \
            \( -type f -o -type l \) -name 'libcpupower.so*' \
            -exec cp -a {} "${VERSION_ROOT}/" \;
          cp tools/power/x86/turbostat/turbostat "${VERSION_ROOT}/turbostat"
          cp tools/power/x86/x86_energy_perf_policy/x86_energy_perf_policy \
            "${VERSION_ROOT}/x86_energy_perf_policy"
          cp tools/tracing/rtla/rtla "${VERSION_ROOT}/rtla"

          USBIP_BIN="$(find tools/usb/usbip -path '*/.libs/usbip' -type f -perm -111 -print -quit)"
          USBIPD_BIN="$(find tools/usb/usbip -path '*/.libs/usbipd' -type f -perm -111 -print -quit)"
          USBIP_LIB="$(find tools/usb/usbip -type f -name 'libusbip.so.*' -print -quit)"
          test -n "${USBIP_BIN}"
          test -n "${USBIPD_BIN}"
          test -n "${USBIP_LIB}"

          cp "${USBIP_BIN}" "${VERSION_ROOT}/usbip"
          cp "${USBIPD_BIN}" "${VERSION_ROOT}/usbipd"
          cp -a "${USBIP_LIB}" "${VERSION_ROOT}/"
          USBIP_LIB_DIR="$(dirname "${USBIP_LIB}")"
          find "${USBIP_LIB_DIR}" -maxdepth 1 -type l -name 'libusbip.so*' \
            -exec cp -a {} "${VERSION_ROOT}/" \; || true

          for tool in acpidbg acpidump ec pfrut; do
            ACPI_BIN="$(find tools/power/acpi -type f -name "${tool}" -perm -111 -print -quit)"
            test -n "${ACPI_BIN}"
            cp "${ACPI_BIN}" "${VERSION_ROOT}/${tool}"
          done

          patchelf --set-rpath '$ORIGIN' "${VERSION_ROOT}/cpupower"
          patchelf --set-rpath '$ORIGIN' "${VERSION_ROOT}/usbip"
          patchelf --set-rpath '$ORIGIN' "${VERSION_ROOT}/usbipd"

          find "${VERSION_ROOT}" -maxdepth 1 -type f -exec chmod 0755 {} +
          cp "${VERSION_ROOT}/perf" "../output/bin/perf-${XANMOD_KERNEL}-amd64"

      - name: Check runtime dependencies before packaging
        run: |
          set -euxo pipefail
          VERSION_ROOT="output/tools/${XANMOD_KERNEL}"
          while IFS= read -r -d '' binary; do
            if file -b "${binary}" | grep -q 'ELF'; then
              echo "Checking ${binary}"
              if ldd "${binary}" 2>/dev/null | grep -q 'not found'; then
                ldd "${binary}" || true
                echo "Missing runtime dependency in ${binary}"
                exit 1
              fi
            fi
          done < <(find "${VERSION_ROOT}" -maxdepth 1 -type f -perm -111 -print0)

      - name: Prepare Debian package
        run: |
          set -euxo pipefail
          PACKAGE_DIR="linux-tools-${XANMOD_KERNEL}"
          VERSION_ROOT="${PACKAGE_DIR}/usr/lib/linux-tools/${XANMOD_KERNEL}"
          SOURCE_ROOT="output/tools/${XANMOD_KERNEL}"
          mkdir -p "${PACKAGE_DIR}/DEBIAN" "${VERSION_ROOT}"
          cp -a "${SOURCE_ROOT}/." "${VERSION_ROOT}/"

          declare -A RUNTIME_PKGS=()
          mapfile -t BINARIES < <(find "${VERSION_ROOT}" -maxdepth 1 -type f -perm -111 -print)

          for binary in "${BINARIES[@]}"; do
            if ! file -b "${binary}" | grep -q '^ELF'; then
              continue
            fi
            while read -r libpath; do
              [ -n "${libpath}" ] || continue
              pkg="$(dpkg-query -S "${libpath}" 2>/dev/null | head -n1 | cut -d: -f1 || true)"
              [ -n "${pkg}" ] && RUNTIME_PKGS["${pkg}"]=1
            done < <(ldd "${binary}" 2>/dev/null | awk '/=> \/.* \(/ {print $3} /^\// {print $1}' | sort -u)
          done

          SHLIB_DEPS="$(printf '%s\n' "${!RUNTIME_PKGS[@]}" | sort -u | paste -sd, -)"

          {
            printf 'Package: linux-tools-%s\n' "${XANMOD_KERNEL}"
            printf 'Version: %s\n' "${PACKAGE_VERSION}"
            printf 'Section: devel\n'
            printf 'Priority: optional\n'
            printf 'Architecture: amd64\n'
            printf 'Maintainer: XanMod Tools Community\n'
            if [ -n "${SHLIB_DEPS}" ]; then
              printf 'Depends: %s\n' "${SHLIB_DEPS}"
            fi
            printf 'Description: Linux kernel tools for XanMod %s\n' "${XANMOD_VERSION}"
            printf ' Version-specific Linux userspace tools built from the matching XanMod kernel source.\n'
            printf ' Includes perf, bpftool, cpupower, turbostat, x86_energy_perf_policy,\n'
            printf ' rtla, USB/IP, and ACPI tools.\n'
          } > "${PACKAGE_DIR}/DEBIAN/control"

          dpkg-deb --build "${PACKAGE_DIR}" \
            "output/linux-tools-${XANMOD_KERNEL}_${PACKAGE_VERSION}_amd64.deb"

      - name: Inspect Debian package
        run: |
          dpkg-deb --info "output/linux-tools-${XANMOD_KERNEL}_${PACKAGE_VERSION}_amd64.deb"
          dpkg-deb --contents "output/linux-tools-${XANMOD_KERNEL}_${PACKAGE_VERSION}_amd64.deb"

      - name: Test Debian package
        run: |
          set -euxo pipefail
          DEB="output/linux-tools-${XANMOD_KERNEL}_${PACKAGE_VERSION}_amd64.deb"
          sudo dpkg -i "${DEB}"
          ROOT="/usr/lib/linux-tools/${XANMOD_KERNEL}"
          for tool in perf bpftool cpupower turbostat x86_energy_perf_policy rtla usbip usbipd acpidbg acpidump ec pfrut; do
            test -x "${ROOT}/${tool}"
          done
          "${ROOT}/perf" version
          "${ROOT}/bpftool" version
          "${ROOT}/cpupower" --version
          "${ROOT}/turbostat" --version
          "${ROOT}/x86_energy_perf_policy" --help >/dev/null 2>&1 || test $? -eq 1
          "${ROOT}/rtla" --help >/dev/null
          "${ROOT}/usbip" version
          "${ROOT}/usbipd" --version || true
          "${ROOT}/acpidbg" --help >/dev/null 2>&1 || true
          "${ROOT}/acpidump" --help >/dev/null 2>&1 || true
          "${ROOT}/ec" --help >/dev/null 2>&1 || true
          "${ROOT}/pfrut" --help >/dev/null 2>&1 || true

          while IFS= read -r -d '' binary; do
            if file -b "${binary}" | grep -q 'ELF' && ldd "${binary}" 2>/dev/null | grep -q 'not found'; then
              ldd "${binary}" || true
              echo "Installed package has missing runtime dependency: ${binary}"
              exit 1
            fi
          done < <(find "${ROOT}" -maxdepth 1 -type f -perm -111 -print0)

      - name: Upload Linux tools binaries
        uses: actions/upload-artifact@v4
        with:
          name: linux-tools-${{ env.XANMOD_KERNEL }}-amd64
          path: output/tools/${{ env.XANMOD_KERNEL }}/
          if-no-files-found: error

      - name: Create tools archive
        run: |
          tar -C output/tools -czf \
            "output/linux-tools-${XANMOD_KERNEL}-amd64.tar.gz" \
            "${XANMOD_KERNEL}"

      - name: Upload tools archive
        uses: actions/upload-artifact@v4
        with:
          name: linux-tools-${{ env.XANMOD_KERNEL }}-tarball
          path: output/linux-tools-${{ env.XANMOD_KERNEL }}-amd64.tar.gz
          if-no-files-found: error

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: linux-tools-${{ env.XANMOD_KERNEL }}-deb
          path: output/linux-tools-${{ env.XANMOD_KERNEL }}_${{ env.PACKAGE_VERSION }}_amd64.deb
          if-no-files-found: error

      - name: Checkout APT repository branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: apt-pages
          fetch-depth: 1

      - name: Import APT signing key
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "${APT_GPG_PRIVATE_KEY}"
          export GNUPGHOME="${RUNNER_TEMP}/gnupg"
          mkdir -m 700 -p "${GNUPGHOME}"

          KEY_FILE="${RUNNER_TEMP}/apt-signing-key"
          printf '%s\n' "${APT_GPG_PRIVATE_KEY}" > "${KEY_FILE}"

          IMPORT_OK=0
          if grep -q '^-----BEGIN PGP ' "${KEY_FILE}"; then
            if gpg --batch --import "${KEY_FILE}"; then
              IMPORT_OK=1
            fi
          else
            CLEAN_B64="$(tr -d '[:space:]' < "${KEY_FILE}")"
            printf '%s' "${CLEAN_B64}" | base64 --decode -i > "${RUNNER_TEMP}/apt-signing-key.decoded" || true
            if gpg --batch --import "${RUNNER_TEMP}/apt-signing-key.decoded"; then
              IMPORT_OK=1
            fi
            rm -f "${RUNNER_TEMP}/apt-signing-key.decoded"
          fi

          rm -f "${KEY_FILE}"
          if [ "${IMPORT_OK}" -ne 1 ] || ! gpg --batch --with-colons --list-secret-keys | grep -q '^sec:'; then
            echo "Failed to import an APT secret signing key."
            exit 1
          fi

          echo "GNUPGHOME=${GNUPGHOME}" >> "${GITHUB_ENV}"

      - name: Resolve APT signing fingerprint
        run: |
          set -euo pipefail
          FINGERPRINT="$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1 == "fpr" {print $10; exit}')"
          test -n "${FINGERPRINT}"
          echo "APT_GPG_FINGERPRINT=${FINGERPRINT}" >> "${GITHUB_ENV}"

      - name: Rebuild signed APT repository
        run: |
          set -euxo pipefail
          APT_REPO="${RUNNER_TEMP}/apt-repo"
          CURRENT_DEB="linux-tools-${XANMOD_KERNEL}_${PACKAGE_VERSION}_amd64.deb"
          mkdir -p "${APT_REPO}/conf"
          printf '%s\n' \
            "Codename: ${APT_CODENAME}" \
            "Suite: ${APT_CODENAME}" \
            "Architectures: amd64" \
            "Components: ${APT_COMPONENT}" \
            "Origin: XanMod Tools" \
            "Label: XanMod Tools" \
            "Description: XanMod kernel-specific Linux tools" \
            "SignWith: ${APT_GPG_FINGERPRINT}" \
            > "${APT_REPO}/conf/distributions"

          find apt-pages/pool -type f -name '*.deb' ! -name "${CURRENT_DEB}" -print0 2>/dev/null | \
            while IFS= read -r -d '' pkg; do
              reprepro -b "${APT_REPO}" includedeb "${APT_CODENAME}" "${pkg}"
            done

          reprepro -b "${APT_REPO}" remove "${APT_CODENAME}" \
            "linux-tools-${XANMOD_KERNEL}" || true
          reprepro -b "${APT_REPO}" includedeb "${APT_CODENAME}" \
            "output/${CURRENT_DEB}"

          gpg --export-options export-minimal --export "${APT_GPG_FINGERPRINT}" \
            > "${APT_REPO}/xanmodtools.gpg"

      - name: Validate APT repository
        run: |
          set -eux
          test -s "${RUNNER_TEMP}/apt-repo/dists/${APT_CODENAME}/InRelease"
          test -s "${RUNNER_TEMP}/apt-repo/dists/${APT_CODENAME}/main/binary-amd64/Packages"
          gpgv --keyring "${RUNNER_TEMP}/apt-repo/xanmodtools.gpg" \
            "${RUNNER_TEMP}/apt-repo/dists/${APT_CODENAME}/InRelease"
          grep -q "Package: linux-tools-${XANMOD_KERNEL}" \
            "${RUNNER_TEMP}/apt-repo/dists/${APT_CODENAME}/main/binary-amd64/Packages"

      - name: Publish APT repository to gh-pages
        run: |
          rm -rf apt-pages/dists apt-pages/pool
          cp -a "${RUNNER_TEMP}/apt-repo/dists" apt-pages/
          cp -a "${RUNNER_TEMP}/apt-repo/pool" apt-pages/
          cp "${RUNNER_TEMP}/apt-repo/xanmodtools.gpg" apt-pages/
          cd apt-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dists pool xanmodtools.gpg
          if git diff --cached --quiet; then
            echo "No APT repository changes to publish."
            exit 0
          fi
          git commit -m "Publish XanMod ${XANMOD_KERNEL} tools"
          git push origin HEAD:gh-pages

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            output/bin/perf-${{ env.XANMOD_KERNEL }}-amd64
            output/linux-tools-${{ env.XANMOD_KERNEL }}_${{ env.PACKAGE_VERSION }}_amd64.deb
            output/linux-tools-${{ env.XANMOD_KERNEL }}-amd64.tar.gz
          generate_release_notes: true
