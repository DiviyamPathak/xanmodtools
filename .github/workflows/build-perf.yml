name: Build XanMod Linux Tools

on:
  workflow_dispatch:

  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  XANMOD_VERSION: "7.1.6"
  XANMOD_TAG: "7.1.6-xanmod1"
  XANMOD_KERNEL: "7.1.6-x64v3-xanmod1"
  PACKAGE_VERSION: "7.1.6-1"
  APT_CODENAME: "noble"
  APT_COMPONENT: "main"

jobs:
  build-tools:
    runs-on: ubuntu-24.04

    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            build-essential \
            flex \
            bison \
            pkg-config \
            autoconf \
            automake \
            libtool \
            libelf-dev \
            libdw-dev \
            libunwind-dev \
            libslang2-dev \
            libperl-dev \
            libpython3-dev \
            libcap-dev \
            libnuma-dev \
            libbabeltrace-dev \
            libtraceevent-dev \
            libtracefs-dev \
            libpfm4-dev \
            libssl-dev \
            libzstd-dev \
            liblzma-dev \
            libaudit-dev \
            libdebuginfod-dev \
            systemtap-sdt-dev \
            llvm \
            libcapstone-dev \
            libpci-dev \
            libpopt-dev \
            libudev-dev \
            libbpf-dev \
            libuuid-dev \
            clang \
            python3-docutils \
            default-jdk \
            reprepro \
            gnupg

      - name: Clone XanMod source
        run: |
          git clone \
            --depth 1 \
            --branch "${XANMOD_TAG}" \
            https://gitlab.com/xanmod/linux.git \
            xanmod-linux

      - name: Build kernel userspace tools
        working-directory: xanmod-linux
        run: |
          set -euxo pipefail
          make -C tools/perf -j"$(nproc)"
          make -C tools/bpf/bpftool -j"$(nproc)"
          make -C tools/power/cpupower -j"$(nproc)"
          make -C tools/power/x86/turbostat -j"$(nproc)"
          make -C tools/power/x86/x86_energy_perf_policy -j"$(nproc)"
          make -C tools/tracing/rtla -j"$(nproc)"

          # USB/IP uses Autotools and does not have a generated Makefile in
          # the clean kernel source tree.
          cd tools/usb/usbip
          ./autogen.sh
          ./configure --with-tcp-wrappers=no
          make -j"$(nproc)"

          cd ../../..
          make -C tools acpi -j"$(nproc)"

      - name: Verify built tools
        working-directory: xanmod-linux
        run: |
          set -eux
          ./tools/perf/perf version
          ./tools/bpf/bpftool/src/bpftool version || ./tools/bpf/bpftool/bpftool version
          ./tools/power/cpupower/cpupower --version || true
          ./tools/power/x86/turbostat/turbostat --version
          ./tools/power/x86/x86_energy_perf_policy/x86_energy_perf_policy --help >/dev/null
          ./tools/tracing/rtla/rtla --help >/dev/null
          ./tools/usb/usbip/src/usbip --version || true
          ./tools/usb/usbip/src/usbipd --version || true

      - name: Prepare tools tree
        run: |
          set -euxo pipefail
          VERSION_ROOT="output/tools/${XANMOD_KERNEL}"
          mkdir -p "${VERSION_ROOT}" output/bin

          cp xanmod-linux/tools/perf/perf "${VERSION_ROOT}/perf"
          if [ -f xanmod-linux/tools/perf/libperf-jvmti.so ]; then
            cp xanmod-linux/tools/perf/libperf-jvmti.so "${VERSION_ROOT}/libperf-jvmti.so"
          fi

          if [ -f xanmod-linux/tools/bpf/bpftool/src/bpftool ]; then
            cp xanmod-linux/tools/bpf/bpftool/src/bpftool "${VERSION_ROOT}/bpftool"
          elif [ -f xanmod-linux/tools/bpf/bpftool/bpftool ]; then
            cp xanmod-linux/tools/bpf/bpftool/bpftool "${VERSION_ROOT}/bpftool"
          else
            echo "bpftool binary not found"
            exit 1
          fi

          cp xanmod-linux/tools/power/cpupower/cpupower "${VERSION_ROOT}/cpupower"
          cp xanmod-linux/tools/power/x86/turbostat/turbostat "${VERSION_ROOT}/turbostat"
          cp xanmod-linux/tools/power/x86/x86_energy_perf_policy/x86_energy_perf_policy \
            "${VERSION_ROOT}/x86_energy_perf_policy"
          cp xanmod-linux/tools/tracing/rtla/rtla "${VERSION_ROOT}/rtla"
          cp xanmod-linux/tools/usb/usbip/src/usbip "${VERSION_ROOT}/usbip"
          cp xanmod-linux/tools/usb/usbip/src/usbipd "${VERSION_ROOT}/usbipd"

          chmod 0755 "${VERSION_ROOT}"/*
          cp "${VERSION_ROOT}/perf" "output/bin/perf-${XANMOD_KERNEL}-amd64"

      - name: Prepare Debian package
        run: |
          set -euxo pipefail
          PACKAGE_DIR="linux-tools-${XANMOD_KERNEL}"
          VERSION_ROOT="${PACKAGE_DIR}/usr/lib/linux-tools/${XANMOD_KERNEL}"
          mkdir -p "${PACKAGE_DIR}/DEBIAN" "${VERSION_ROOT}"
          cp -a "output/tools/${XANMOD_KERNEL}/." "${VERSION_ROOT}/"

          cat > "${PACKAGE_DIR}/DEBIAN/control" <<EOF
          Package: linux-tools-${XANMOD_KERNEL}
          Version: ${PACKAGE_VERSION}
          Section: devel
          Priority: optional
          Architecture: amd64
          Maintainer: XanMod Tools Community
          Description: Linux kernel tools for XanMod ${XANMOD_VERSION}
           Version-specific Linux userspace tools built from the matching XanMod kernel source.
           Includes perf, bpftool, cpupower, turbostat, x86_energy_perf_policy,
           rtla, and USB/IP tools.
          EOF

          dpkg-deb --build "${PACKAGE_DIR}" \
            "output/linux-tools-${XANMOD_KERNEL}_${PACKAGE_VERSION}_amd64.deb"

      - name: Inspect Debian package
        run: |
          dpkg-deb --info "output/linux-tools-${XANMOD_KERNEL}_${PACKAGE_VERSION}_amd64.deb"
          dpkg-deb --contents "output/linux-tools-${XANMOD_KERNEL}_${PACKAGE_VERSION}_amd64.deb"

      - name: Test Debian package
        run: |
          set -eux
          sudo dpkg -i "output/linux-tools-${XANMOD_KERNEL}_${PACKAGE_VERSION}_amd64.deb"
          for tool in perf bpftool cpupower turbostat x86_energy_perf_policy rtla usbip usbipd; do
            test -x "/usr/lib/linux-tools/${XANMOD_KERNEL}/${tool}"
          done
          "/usr/lib/linux-tools/${XANMOD_KERNEL}/perf" version
          "/usr/lib/linux-tools/${XANMOD_KERNEL}/bpftool" version

      - name: Test Ubuntu perf dispatcher
        run: |
          /usr/bin/perf version

      - name: Upload Linux tools binaries
        uses: actions/upload-artifact@v4
        with:
          name: linux-tools-${{ env.XANMOD_KERNEL }}-amd64
          path: output/tools/${{ env.XANMOD_KERNEL }}/
          if-no-files-found: error

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: linux-tools-${{ env.XANMOD_KERNEL }}-deb
          path: output/linux-tools-${{ env.XANMOD_KERNEL }}_${{ env.PACKAGE_VERSION }}_amd64.deb
          if-no-files-found: error

      - name: Checkout APT repository branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: apt-pages
          fetch-depth: 1

      - name: Import APT signing key
        env:
          APT_GPG_PRIVATE_KEY_B64: ${{ secrets.APT_GPG_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${APT_GPG_PRIVATE_KEY_B64}" ]; then
            echo "APT_GPG_PRIVATE_KEY_B64 GitHub Actions secret is required."
            exit 1
          fi

          export GNUPGHOME="${RUNNER_TEMP}/gnupg"
          mkdir -m 700 -p "${GNUPGHOME}"
          printf '%s' "${APT_GPG_PRIVATE_KEY_B64}" | base64 --decode | gpg --batch --import
          echo "GNUPGHOME=${GNUPGHOME}" >> "${GITHUB_ENV}"

      - name: Resolve APT signing fingerprint
        run: |
          set -euo pipefail
          FINGERPRINT="$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1 == "fpr" {print $10; exit}')"
          if [ -z "${FINGERPRINT}" ]; then
            echo "No secret signing key was imported."
            exit 1
          fi
          echo "APT_GPG_FINGERPRINT=${FINGERPRINT}" >> "${GITHUB_ENV}"

      - name: Rebuild signed APT repository
        run: |
          set -euxo pipefail
          APT_REPO="${RUNNER_TEMP}/apt-repo"
          mkdir -p "${APT_REPO}/conf"

          cat > "${APT_REPO}/conf/distributions" <<EOF
          Codename: ${APT_CODENAME}
          Suite: ${APT_CODENAME}
          Architectures: amd64
          Components: ${APT_COMPONENT}
          Origin: XanMod Tools
          Label: XanMod Tools
          Description: XanMod kernel-specific Linux tools
          SignWith: ${APT_GPG_FINGERPRINT}
          EOF

          find apt-pages/pool -type f -name '*.deb' -print0 2>/dev/null | \
            while IFS= read -r -d '' pkg; do
              reprepro -b "${APT_REPO}" includedeb "${APT_CODENAME}" "${pkg}"
            done

          reprepro -b "${APT_REPO}" remove "${APT_CODENAME}" \
            "linux-tools-${XANMOD_KERNEL}" || true

          reprepro -b "${APT_REPO}" includedeb "${APT_CODENAME}" \
            "output/linux-tools-${XANMOD_KERNEL}_${PACKAGE_VERSION}_amd64.deb"

          gpg --export-options export-minimal \
            --export "${APT_GPG_FINGERPRINT}" \
            > "${APT_REPO}/xanmodtools.gpg"

      - name: Validate APT repository
        run: |
          set -eux
          test -s "${RUNNER_TEMP}/apt-repo/dists/${APT_CODENAME}/InRelease"
          test -s "${RUNNER_TEMP}/apt-repo/dists/${APT_CODENAME}/main/binary-amd64/Packages"
          gpgv --keyring "${RUNNER_TEMP}/apt-repo/xanmodtools.gpg" \
            "${RUNNER_TEMP}/apt-repo/dists/${APT_CODENAME}/InRelease"

      - name: Publish APT repository to gh-pages
        run: |
          rm -rf apt-pages/dists apt-pages/pool
          cp -a "${RUNNER_TEMP}/apt-repo/dists" apt-pages/
          cp -a "${RUNNER_TEMP}/apt-repo/pool" apt-pages/
          cp "${RUNNER_TEMP}/apt-repo/xanmodtools.gpg" apt-pages/

          cd apt-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dists pool xanmodtools.gpg

          if git diff --cached --quiet; then
            echo "No APT repository changes to publish."
            exit 0
          fi

          git commit -m "Publish XanMod ${XANMOD_KERNEL} tools"
          git push origin HEAD:gh-pages

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            output/bin/perf-${{ env.XANMOD_KERNEL }}-amd64
            output/linux-tools-${{ env.XANMOD_KERNEL }}_${{ env.PACKAGE_VERSION }}_amd64.deb
          generate_release_notes: true